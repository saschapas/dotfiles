# Font
font_family      MesloLGS Nerd Font Mono
font_size        11.0

# Shell
shell /usr/bin/zsh

# Window
background_opacity 0.7
initial_window_width  160c
initial_window_height 50c
hide_window_decorations yes

# Tabs (Kitty-Standarddarstellung, Farben passend zum Thema)
tab_bar_edge             bottom
tab_bar_style            fade
active_tab_foreground    #021A12
active_tab_background    #44FFB1
inactive_tab_foreground  #8FBFA8
inactive_tab_background  #0A2A1E
tab_bar_background       #021A12

# Colors (Coolnight, grünlich)
foreground #CBF0DC
background #021A12
cursor #47FF9C
cursor_text_color #021A12
selection_background #0B4A33
selection_foreground #CBF0DC

# ANSI colors
color0  #1F4A3A
color1  #E52E2E
color2  #44FFB1
color3  #FFE073
color4  #0FC5ED
color5  #a277ff
color6  #24EAF7
color7  #CBF0DC

# Brights
color8  #2E6B52
color9  #FF5C5C
color10 #7DFFC8
color11 #FFEA9E
color12 #4FD6F5
color13 #BFA0FF
color14 #6FF2FA
color15 #FFFFFF

# Tilde key fix (Alt+n -> ~)
map alt+n send_text all ~
